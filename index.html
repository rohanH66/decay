<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decay!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap');

  :root{
    --page: #17130f;
    --board-wood: #2c2319;
    --board-wood-light: #3a2e21;
    --line: #6b5843;
    --cream: #ece3d1;
    --amber-hi: #f4c274;
    --amber-lo: #a9711f;
    --teal-hi: #7ec2c4;
    --teal-lo: #2f5c5e;
    --ash: #948c7c;
    --ember: #e2703f;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--cream);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .wrap{
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: 0.5px;
    margin: 0;
    color: var(--cream);
  }

  .decay-title{
    display:flex;
    align-items:baseline;
    gap:0.01em;
  }
  .decay-title span{display:inline-block;}
  .decay-title span:nth-child(1){opacity:1;}
  .decay-title span:nth-child(2){opacity:.93; transform:translateY(1px) rotate(-1deg);}
  .decay-title span:nth-child(3){opacity:.78; transform:translateY(2px) rotate(2deg);}
  .decay-title span:nth-child(4){opacity:.52; transform:translateY(4px) rotate(-5deg) scale(.96); filter:blur(.25px);}
  .decay-title span:nth-child(5){opacity:.22; transform:translateY(7px) rotate(9deg) scale(.88); filter:blur(.7px); text-shadow:8px 4px 10px rgba(236,227,209,.12);}

  .subtitle{
    margin: -12px 0 0;
    font-size: 14px;
    color: var(--ash);
    text-align: center;
  }

  .statusbar{
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .difficulty{
    width: 100%;
    margin: 0;
    padding: 4px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .difficulty label{ position: relative; cursor: pointer; }
  .difficulty input{
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    clip-path: inset(50%);
  }
  .difficulty span{
    display: block;
    padding: 9px 4px;
    border-radius: 4px;
    text-align: center;
    font-size: 14px;
    color: var(--ash);
  }
  .difficulty label:hover span{ color: var(--cream); }
  .difficulty input:checked + span{ background: var(--amber-hi); color: var(--page); }
  .difficulty input:focus-visible + span{ outline: 2px solid var(--ember); outline-offset: 2px; }

  .player-tag{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .player-tag.active{
    border-color: var(--ember);
    box-shadow: 0 0 0 1px var(--ember) inset;
  }

  .dot{
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .dot.amber{ background: radial-gradient(circle at 35% 30%, var(--amber-hi), var(--amber-lo)); }
  .dot.teal{ background: radial-gradient(circle at 35% 30%, var(--teal-hi), var(--teal-lo)); }

  .board{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board-wood);
    border-radius: 10px;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 0;
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .cell{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    cursor: pointer;
    background: var(--board-wood-light);
  }

  .cell.win{ background: rgba(226,112,63,0.18); }

  .cell:hover:not(.filled):not(.disabled){ background: #45362533; }

  .stone{
    width: 72%;
    height: 72%;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.3);
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), opacity 0.22s ease;
    pointer-events: none;
  }

  .stone.show{ opacity: 1; transform: scale(1); }
  .stone.decaying{
    animation: crumble-to-ash .72s ease forwards;
  }

  @keyframes crumble-to-ash{
    0%{opacity:1; transform:scale(1); filter:grayscale(0) blur(0);}
    35%{opacity:.9; transform:scale(.96) rotate(-2deg); filter:grayscale(.45) blur(.2px);}
    70%{opacity:.45; transform:scale(.82) translateY(5px) rotate(3deg); filter:grayscale(.9) blur(1px);}
    100%{opacity:0; transform:scale(.58) translateY(12px) rotate(6deg); filter:grayscale(1) blur(2px);}
  }

  .ash-cloud{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
    z-index:5;
  }

  .ash-particle{
    position:absolute;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#b8b1a5;
    box-shadow:0 0 5px rgba(210,205,195,.18);
    opacity:0;
    animation:ash-fall .9s ease-out forwards;
    animation-delay:var(--delay);
  }

  @keyframes ash-fall{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
    15%{opacity:.85;}
    55%{opacity:.7; transform:translate(calc(-50% + var(--x1)), calc(-50% + var(--y1))) scale(.8) rotate(var(--rot));}
    100%{opacity:0; transform:translate(calc(-50% + var(--x2)), calc(-50% + var(--y2))) scale(.25) rotate(var(--rot2));}
  }

  .stone.amber{ background: radial-gradient(circle at 35% 28%, var(--amber-hi), var(--amber-lo)); }
  .stone.teal{ background: radial-gradient(circle at 35% 28%, var(--teal-hi), var(--teal-lo)); }

  .banner{
    min-height: 20px;
    font-size: 15px;
    text-align: center;
    color: var(--ash);
  }

  .banner.win{ color: var(--ember); font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }

  button{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 18px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  button:hover{ border-color: var(--ember); background: #e2703f14; }

  .simulation-controls{
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 108px;
    gap: 10px;
  }
  .speed{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #simulate[aria-pressed="true"]{ border-color: var(--ember); }
  .repeat{ display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ash); cursor: pointer; }
  .repeat input{ accent-color: var(--amber-hi); }
  .board.simulating .cell{ cursor: default; }
  .board.fast .stone{ transition: none; }
  #dev{
    position: fixed;
    right: 12px;
    bottom: 12px;
    padding: 5px 9px;
    font-size: 11px;
    background: var(--page);
    color: var(--ash);
  }
  .dev-menu{
    inset: auto 12px 48px auto;
    margin: 0;
    width: min(360px, calc(100% - 24px));
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--page);
    color: var(--cream);
  }
  .dev-menu:popover-open{ display: grid; gap: 14px; }
  .dev-menu h2{ margin: 0; font-size: 18px; font-weight: 500; }

  .legend{
    font-size: 12.5px;
    color: var(--ash);
    text-align: center;
    line-height: 1.5;
    max-width: 380px;
  }

  .x-mini{font-family: 'Fraunces', serif; font-size:16px; font-weight:600; line-height:1;}
  .amber-x{color:var(--amber-hi); text-shadow:0 0 10px rgba(244,194,116,.28);}
  .teal-x{color:var(--teal-hi); text-shadow:0 0 10px rgba(126,194,196,.28);}
  .o-mini{font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:500;line-height:1;}

  .stone{
    width: 78%;
    height: 78%;
    border-radius: 16px;
    opacity: 0;
    transform: scale(0.3);
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), opacity 0.22s ease, filter .2s ease;
    pointer-events: none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent !important;
    position:relative;
  }

  .x-glyph{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(34px, 9vw, 58px);
    line-height:1;
    transform:translateY(-1px);
  }

  .stone.amber .x-glyph{color:var(--amber-hi);text-shadow:0 0 18px rgba(244,194,116,.22);}
  .stone.teal .x-glyph{color:var(--teal-hi);text-shadow:0 0 18px rgba(126,194,196,.22);}
  .stone.teal .x-glyph{font-family:'IBM Plex Sans',sans-serif;font-weight:500;}

  .stone.expiring:not(.decaying)::after{
    content: '';
    position: absolute;
    inset: -7% 3%;
    border: 3px solid var(--amber-hi);
    border-radius: 50%;
    pointer-events: none;
    animation: decay-ring-flash 1.4s ease-in-out infinite;
  }
  .stone.teal.expiring::after{ border-color: var(--teal-hi); }

  @keyframes decay-ring-flash{
    0%, 100%{ opacity: 1; }
    50%{ opacity: .15; }
  }
  @media (prefers-reduced-motion: reduce){
    .stone.expiring:not(.decaying)::after{ animation: none; }
  }

  .stone.expiring .order{
    z-index: 1;
    opacity: 1;
    background: var(--board-wood-light);
    box-shadow: 0 0 0 3px var(--board-wood-light);
  }

  .order{
    position:absolute;
    right:6%;
    bottom:7%;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;
    font-weight:500;
    line-height:1;
    opacity:.9;
  }
  .stone.amber .order{color:var(--amber-hi);}
  .stone.teal .order{color:var(--teal-hi);}
  .board[data-difficulty="hard"] .order{ display: none; }

</style>
</head>
<body>

<div class="wrap">
  <h1 class="decay-title"><span>D</span><span>e</span><span>c</span><span>a</span><span>y</span></h1>
  <fieldset class="difficulty" aria-label="Difficulty">
    <label><input type="radio" name="difficulty" value="easy" checked><span>Easy</span></label>
    <label><input type="radio" name="difficulty" value="medium"><span>Medium</span></label>
    <label><input type="radio" name="difficulty" value="hard"><span>Hard</span></label>
  </fieldset>
  <div class="statusbar">
    <div class="player-tag amber" id="tag1">
      <span class="x-mini amber-x">X</span>
      <span>Player 1</span>
    </div>
    <div class="player-tag teal" id="tag2">
      <span class="o-mini teal-x">O</span>
      <span>Player 2</span>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="banner" id="banner">Amber's move</div>

  <button id="restart">New game</button>

  <p class="legend">Each player can keep 6 marks on the board. Player 1 uses X and Player 2 uses O. When a 7th is placed, the oldest disappears.</p>
</div>

<button id="dev" popovertarget="dev-menu">Dev</button>
<div id="dev-menu" class="dev-menu" popover aria-labelledby="dev-title">
  <h2 id="dev-title">Simulation</h2>
  <div class="simulation-controls">
    <fieldset class="difficulty speed" aria-label="Simulation speed">
      <label title="1 move per second"><input type="radio" name="speed" value="normal" checked><span>Normal</span></label>
      <label title="20 moves per second"><input type="radio" name="speed" value="fast"><span>Fast</span></label>
    </fieldset>
    <button id="simulate" aria-pressed="false">Simulate</button>
  </div>
  <label class="repeat"><input type="checkbox" id="repeat">Repeat games</label>
</div>

<script>
const SIZE = 5;
const MAX_ALIVE = 6;
const board = document.getElementById('board');
const bannerEl = document.getElementById('banner');
const tag1 = document.getElementById('tag1');
const tag2 = document.getElementById('tag2');
const simulateButton = document.getElementById('simulate');
const repeatInput = document.getElementById('repeat');
const WIN_LINES = [
  ...Array.from({length: SIZE}, (_, r) => Array.from({length: SIZE}, (_, c) => [r, c])),
  ...Array.from({length: SIZE}, (_, c) => Array.from({length: SIZE}, (_, r) => [r, c])),
  Array.from({length: SIZE}, (_, i) => [i, i]),
  Array.from({length: SIZE}, (_, i) => [i, SIZE - 1 - i])
];

let state, queues, current, winner, cellEls, stoneEls, moveCounters;
let difficulty = 'easy';
let simulationActive = false;
let simulationTimer = null;
let simulationSpeed = 'normal';
let simulationMoves = 0;

function init(){
  simulationMoves = 0;
  state = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  queues = {1: [], 2: []};
  moveCounters = {1: 0, 2: 0};
  current = 1;
  winner = null;
  board.innerHTML = '';
  cellEls = [];
  stoneEls = [];

  for(let r = 0; r < SIZE; r++){
    for(let c = 0; c < SIZE; c++){
      const idx = r * SIZE + c;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', onCellClick);

      const stone = document.createElement('div');
      stone.className = 'stone';
      stone.innerHTML = '<span class="x-glyph"></span><sub class="order"></sub>';
      cell.appendChild(stone);

      board.appendChild(cell);
      cellEls[idx] = cell;
      stoneEls[idx] = stone;
    }
  }

  updateUI();
}

function idx(r, c){ return r * SIZE + c; }

function onCellClick(e){
  if(simulationActive) return;
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  playMove(r, c);
}

function playMove(r, c){
  if(winner || state[r][c] !== 0) return;

  placeStone(r, c, current);

  if(checkWin(current)){
    winner = current;
    updateUI();
    return;
  }

  current = current === 1 ? 2 : 1;
  updateUI();
}

function placeStone(r, c, player){
  state[r][c] = player;
  moveCounters[player] += 1;
  queues[player].push([r, c, moveCounters[player]]);

  const i = idx(r, c);
  const stone = stoneEls[i];
  stone.className = 'stone ' + (player === 1 ? 'amber' : 'teal');
  stone.querySelector('.x-glyph').textContent = player === 1 ? 'X' : 'O';
  stone.querySelector('.order').textContent = difficulty === 'hard' ? '' : moveCounters[player];
  cellEls[i].classList.add('filled');
  requestAnimationFrame(() => stone.classList.add('show'));

  if(queues[player].length > MAX_ALIVE){
    const [or, oc] = queues[player].shift();
    const oi = idx(or, oc);
    const oldStone = stoneEls[oi];
    // Remove the mark before checking wins; animate an isolated visual copy.
    state[or][oc] = 0;
    if(!(simulationActive && simulationSpeed === 'fast')){
      const fadingStone = oldStone.cloneNode(true);
      fadingStone.classList.remove('expiring');
      fadingStone.classList.add('decaying');
      fadingStone.style.position = 'absolute';
      cellEls[oi].appendChild(fadingStone);
      spawnAsh(cellEls[oi]);
      setTimeout(() => fadingStone.remove(), 760);
    }
    oldStone.className = 'stone';
    oldStone.querySelector('.x-glyph').textContent = '';
    oldStone.querySelector('.order').textContent = '';
    cellEls[oi].classList.remove('filled');
  }
}


function spawnAsh(cell){
  const cloud = document.createElement('div');
  cloud.className = 'ash-cloud';
  const particles = [
    [-20,-8,-34,24,-15,18,0], [16,-10,28,26,12,33,35], [-6,-18,-12,31,-25,46,70],
    [8,-4,15,22,5,39,110], [-14,5,-26,28,-38,40,150], [20,4,34,30,44,43,190],
    [-2,8,2,30,-4,48,230], [11,12,19,34,27,50,270], [-19,14,-31,35,-42,52,310],
    [4,2,9,20,15,38,350], [-10,-2,-18,25,-28,42,390], [22,-2,39,28,48,45,430]
  ];
  particles.forEach(([x1,y1,x2,y2,rot,rot2,delay], i) => {
    const p = document.createElement('span');
    p.className = 'ash-particle';
    p.style.setProperty('--x1', `${x1}px`);
    p.style.setProperty('--y1', `${y1}px`);
    p.style.setProperty('--x2', `${x2}px`);
    p.style.setProperty('--y2', `${y2}px`);
    p.style.setProperty('--rot', `${rot}deg`);
    p.style.setProperty('--rot2', `${rot2}deg`);
    p.style.setProperty('--delay', `${delay}ms`);
    p.style.width = `${3 + (i % 3)}px`;
    p.style.height = p.style.width;
    cloud.appendChild(p);
  });
  cell.appendChild(cloud);
  setTimeout(() => cloud.remove(), 1400);
}

function winningLine(position, player){
  return WIN_LINES.find(line => line.every(([r, c]) => position[r][c] === player));
}

function checkWin(player){
  const line = winningLine(state, player);
  return line ? markWin(line) : false;
}

function positionAfterMove(position, r, c, player){
  const next = position.map(row => row.slice());
  next[r][c] = player;
  if(queues[player].length === MAX_ALIVE){
    const [oldR, oldC] = queues[player][0];
    next[oldR][oldC] = 0;
  }
  return next;
}

function chooseComputerMove(){
  const opponent = current === 1 ? 2 : 1;
  let bestScore = -Infinity;
  let bestMove;
  const legalMoves = [];
  for(let r = 0; r < SIZE; r++){
    for(let c = 0; c < SIZE; c++){
      if(state[r][c] !== 0) continue;
      legalMoves.push([r, c]);
      const next = positionAfterMove(state, r, c, current);
      if(winningLine(next, current)) return [r, c];
      let score = Math.random() * 8;
      for(const line of WIN_LINES){
        const marks = line.map(([lr, lc]) => next[lr][lc]);
        if(!marks.includes(opponent)) score += [0, 1, 4, 16, 64][marks.filter(p => p === current).length];
      }
      // Account for both players' next decay when looking for immediate threats.
      for(let or = 0; or < SIZE; or++){
        for(let oc = 0; oc < SIZE; oc++){
          if(next[or][oc] === 0 && winningLine(positionAfterMove(next, or, oc, opponent), opponent)) score -= 1000;
        }
      }
      if(score > bestScore){ bestScore = score; bestMove = [r, c]; }
    }
  }
  // Occasional exploratory moves break repeated defensive cycles between the bots.
  return Math.random() < 0.2 ? legalMoves[Math.floor(Math.random() * legalMoves.length)] : bestMove;
}

function stopSimulation(){
  clearTimeout(simulationTimer);
  simulationTimer = null;
  simulationActive = false;
  updateUI();
}

function scheduleSimulation(){
  clearTimeout(simulationTimer);
  if(!simulationActive) return;
  const roundOver = winner || simulationMoves >= 300;
  const delay = roundOver ? (simulationSpeed === 'fast' ? 800 : 2200) : (simulationSpeed === 'fast' ? 50 : 1000);
  simulationTimer = setTimeout(() => {
    if(!simulationActive) return;
    if(winner || simulationMoves >= 300){
      if(!repeatInput.checked){ stopSimulation(); return; }
      init();
    }
    const move = chooseComputerMove();
    if(!move){ stopSimulation(); return; }
    simulationMoves += 1;
    playMove(...move);
    if(simulationMoves >= 300 && !winner) bannerEl.textContent = 'Simulation move limit reached';
    if((winner || simulationMoves >= 300) && !repeatInput.checked){
      stopSimulation();
      if(!winner) bannerEl.textContent = 'Simulation move limit reached';
      return;
    }
    scheduleSimulation();
  }, delay);
}

function markWin(cells){
  cells.forEach(([r, c]) => cellEls[idx(r, c)].classList.add('win'));
  return true;
}

function updateUI(){
  board.classList.toggle('simulating', simulationActive);
  board.classList.toggle('fast', simulationActive && simulationSpeed === 'fast');
  simulateButton.textContent = simulationActive ? 'Stop' : 'Simulate';
  simulateButton.setAttribute('aria-pressed', String(simulationActive));
  board.dataset.difficulty = difficulty;
  tag1.classList.toggle('active', current === 1 && !winner);
  tag2.classList.toggle('active', current === 2 && !winner);
  stoneEls.forEach(stone => stone.classList.remove('expiring'));

  [1, 2].forEach(p => {
    queues[p].forEach(([r, c, order], i) => {
      const stone = stoneEls[idx(r, c)];
      if(!stone.classList.contains('decaying')){
        stone.classList.toggle('expiring', difficulty === 'easy' && !winner && p === current && queues[p].length === MAX_ALIVE && i === 0);
        stone.querySelector('.order').textContent = difficulty === 'hard' ? '' : order;
      }
    });
  });

  if(winner){
    bannerEl.textContent = (winner === 1 ? 'Player 1' : 'Player 2') + ' wins';
    bannerEl.classList.add('win');
    board.querySelectorAll('.cell').forEach(c => c.classList.add('disabled'));
  } else {
    bannerEl.textContent = (current === 1 ? "Player 1's" : "Player 2's") + ' move';
    bannerEl.classList.remove('win');
  }
}

document.getElementById('restart').addEventListener('click', () => {
  stopSimulation();
  init();
});
simulateButton.addEventListener('click', () => {
  document.getElementById('dev-menu').hidePopover();
  if(simulationActive){ stopSimulation(); return; }
  simulationActive = true;
  init();
  scheduleSimulation();
});
document.querySelectorAll('input[name="speed"]').forEach(input => {
  input.addEventListener('change', () => {
    simulationSpeed = input.value;
    if(simulationSpeed === 'fast') board.querySelectorAll('.decaying, .ash-cloud').forEach(el => el.remove());
    updateUI();
    scheduleSimulation();
  });
});
document.querySelectorAll('input[name="difficulty"]').forEach(input => {
  input.addEventListener('change', () => {
    difficulty = input.value;
    updateUI();
  });
});
init();
</script>

</body>
</html>
